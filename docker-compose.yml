# docker compose up --build
# Requires backend/.env (copy from backend/.env.example). Frontend: http://localhost:5173
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017   # overrides .env inside Docker
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
